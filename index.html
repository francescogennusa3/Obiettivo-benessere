<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Allenamento</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f4f4;color:#111}
header{position:sticky;top:0;background:#111;color:white;padding:14px 16px;z-index:2}
h1{font-size:20px;margin:0 0 10px}.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px 6px;border:0;border-radius:9px;background:#333;color:#fff}.tabs button.active{background:#fff;color:#111}
main{padding:14px;max-width:700px;margin:auto}.exercise{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.name{font-weight:700}.last{font-size:12px;color:#666;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid label{font-size:11px;color:#666}.grid input{width:100%;font-size:18px;padding:10px;border:1px solid #ccc;border-radius:9px}
button{cursor:pointer}.timer{position:fixed;bottom:14px;left:14px;right:14px;background:#111;color:white;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px #0004}
.timer button{background:white;color:#111;border:0;border-radius:8px;padding:8px 12px}.done{margin-top:10px;width:100%;padding:10px;border:0;border-radius:9px;background:#e8e8e8}
.small{font-size:12px;color:#666;margin:16px 0 80px}
</style>
</head>
<body>
<header><h1>Allenamento</h1><div class="tabs">
<button data-day="1">Giorno 1</button><button data-day="2">Giorno 2</button><button data-day="3">Giorno 3</button>
</div></header>
<main id="app"></main>
<div class="timer"><span id="timerText">Recupero 1:30</span><div><button onclick="setTimer(90)">1:30</button> <button onclick="setTimer(120)">2:00</button> <button onclick="setTimer(180)">3:00</button></div></div>
<script>
const workouts={
1:[
["Chest inclinata manubri","12–14"],["Flyes","—"],["Panca piana","—"],["Pulley","≥40"],["Lat machine","—"],["Macchinario schiena","—"]],
2:[
["Shoulder press manubri","14"],["Tricipiti corda","15"],["Skull crushers","6"],["Overhead extension","14"]],
3:[
["Hammer curl","10–12"],["Barbell curl","5+5"],["Preacher curl","7"],["Extra / libero","—"]]
]};
let day=1, timer=90, interval=null;
const key=(d,i)=>`workout-${d}-${i}`;
function getLast(d,i){let x=localStorage.getItem(key(d,i));return x?JSON.parse(x):null}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",+b.dataset.day===day));
 const a=document.getElementById("app");a.innerHTML="";
 workouts[day].forEach((e,i)=>{
  const last=getLast(day,i), div=document.createElement("section");div.className="exercise";
  div.innerHTML=`<div class="name">${e[0]}</div>
  <div class="last">Ultima volta: ${last?last.sets.map(s=>s.kg+" kg × "+s.reps).join(" · "):"nessun dato"}${e[1]!=="—"?" · riferimento: "+e[1]:""}</div>
  <div class="grid">${[0,1,2].map(s=>`<label>Serie ${s+1}<input inputmode="decimal" placeholder="kg" id="kg-${i}-${s}"></label><label>&nbsp;<input inputmode="numeric" placeholder="reps" id="reps-${i}-${s}"></label>`).join("")}</div>
  <button class="done" onclick="saveExercise(${i})">Salva esercizio + avvia recupero</button>`;
  a.appendChild(div);
 });
 a.insertAdjacentHTML("beforeend",`<p class="small">I dati restano salvati sul dispositivo. Questa versione è predisposta per il collegamento futuro a un database leggibile da ChatGPT.</p>`);
}
function saveExercise(i){
 const sets=[0,1,2].map(s=>({kg:document.getElementById(`kg-${i}-${s}`).value,reps:document.getElementById(`reps-${i}-${s}`).value})).filter(x=>x.kg||x.reps);
 if(!sets.length)return;
 localStorage.setItem(key(day,i),JSON.stringify({date:new Date().toISOString(),sets}));
 setTimer(90); render();
}
function setTimer(sec){timer=sec;clearInterval(interval);document.getElementById("timerText").textContent=`Recupero ${fmt(timer)}`;interval=setInterval(()=>{timer--;document.getElementById("timerText").textContent=`Recupero ${fmt(Math.max(0,timer))}`;if(timer<=0){clearInterval(interval);navigator.vibrate?.(200)}},1000)}
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{day=+b.dataset.day;render()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
render();
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111">
<title>Obiettivo Benessere - Allenamento</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#111}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0}
h1{margin:0 0 12px;font-size:21px}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:#444;color:white}
.tabs button.active{background:white;color:#111}
main{max-width:700px;margin:auto;padding:14px 14px 100px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 5px #0002}
h2{font-size:17px;margin:0 0 5px}
.ref,.last{font-size:12px;color:#666;margin:4px 0 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{font-size:11px;color:#666}
input{width:100%;padding:10px;font-size:17px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.save{width:100%;padding:11px;border:0;border-radius:9px;background:#111;color:white;font-size:15px;margin-top:5px}
.timer{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:white;border-radius:13px;padding:11px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px #0004}
.timer button{border:0;border-radius:7px;padding:7px 9px;margin-left:3px}
</style>
</head>
<body>
<header>
<h1>Allenamento</h1>
<div class="tabs">
<button id="d1" onclick="showDay(1)">Giorno 1</button>
<button id="d2" onclick="showDay(2)">Giorno 2</button>
<button id="d3" onclick="showDay(3)">Giorno 3</button>
</div>
</header>
<main id="content"></main>
<div class="timer">
<span id="timer">Recupero 1:30</span>
<div><button onclick="startTimer(60)">1:00</button><button onclick="startTimer(90)">1:30</button><button onclick="startTimer(120)">2:00</button><button onclick="startTimer(180)">3:00</button></div>
</div>

<script>
const workouts={
1:[
["Chest inclinata manubri","12–14 kg"],
["Flyes","carico da determinare"],
["Panca piana","almeno 20 kg"],
["Pulley","almeno 40 kg"],
["Lat machine","carico da determinare"],
["Macchinario schiena","carico da determinare"]
],
2:[
["Shoulder press manubri","14 kg per manubrio"],
["Tricipiti corda","15 kg"],
["Skull crushers","6 kg"],
["Overhead extension","14 kg, un manubrio"]
],
3:[
["Hammer curl","10–12 kg"],
["Barbell curl","5 + 5 kg"],
["Preacher curl","7 kg"],
["Extra / libero","a scelta"]
]};

let currentDay=1;
let timerInterval=null;

function storageKey(day,i){return "obiettivo_"+day+"_"+i}

function getLast(day,i){
 const raw=localStorage.getItem(storageKey(day,i));
 return raw?JSON.parse(raw):null;
}

function showDay(day){
 currentDay=day;
 [1,2,3].forEach(d=>document.getElementById("d"+d).classList.toggle("active",d===day));
 const content=document.getElementById("content");
 content.innerHTML="";
 workouts[day].forEach((ex,i)=>{
   const last=getLast(day,i);
   const card=document.createElement("section");
   card.className="card";
   let rows="";
   for(let s=1;s<=3;s++){
     rows+=`<div class="row">
       <label>Serie ${s} · kg<input id="kg_${i}_${s}" inputmode="decimal" placeholder="${ex[1]}"></label>
       <label>&nbsp;reps<input id="reps_${i}_${s}" inputmode="numeric" placeholder="8"></label>
     </div>`;
   }
   card.innerHTML=`<h2>${i+1}. ${ex[0]}</h2>
   <div class="ref">Riferimento: ${ex[1]}</div>
   <div class="last">${last?"Ultima seduta: "+last.map(x=>x.kg+" kg × "+x.reps).join(" · "):"Nessuna seduta salvata"}</div>
   ${rows}
   <button class="save" onclick="saveExercise(${i})">Salva esercizio e avvia recupero</button>`;
   content.appendChild(card);
 });
}

function saveExercise(i){
 let sets=[];
 for(let s=1;s<=3;s++){
   const kg=document.getElementById("kg_"+i+"_"+s).value;
   const reps=document.getElementById("reps_"+i+"_"+s).value;
   if(kg||reps) sets.push({kg,reps});
 }
 if(!sets.length){alert("Inserisci almeno una serie.");return}
 localStorage.setItem(storageKey(currentDay,i),JSON.stringify(sets));
 showDay(currentDay);
 startTimer(90);
}

function startTimer(seconds){
 clearInterval(timerInterval);
 let remaining=seconds;
 updateTimer(remaining);
 timerInterval=setInterval(()=>{
   remaining--;
   updateTimer(remaining);
   if(remaining<=0){
     clearInterval(timerInterval);
     if(navigator.vibrate) navigator.vibrate(300);
   }
 },1000);
}

function updateTimer(seconds){
 document.getElementById("timer").textContent="Recupero "+Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
}

showDay(1);
</script>
</body>
</html>
